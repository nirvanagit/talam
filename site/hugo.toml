baseURL = "https://nirvanagit.github.io/talam/"
title = "talam"
enableRobotsTXT = true
enableGitInfo = true

# Docsy needs this to render code blocks etc. via Chroma.
pygmentsCodeFences = true
pygmentsUseClasses = false
pygmentsUseClassic = false
pygmentsStyle = "tango"

theme = ["docsy/theme"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "tango"

[languages]
  [languages.en]
    languageName = "English"
    contentDir = "content/en"
    weight = 1
    title = "talam"

[params]
  copyright = "The talam Authors"
  privacy_policy = ""
  version_menu = "Versions"
  archived_version = false
  version = "v0.1 (pre-release)"
  url_latest_version = "https://nirvanagit.github.io/talam/"
  github_repo = "https://github.com/nirvanagit/talam"
  github_branch = "main"
  github_project_repo = "https://github.com/nirvanagit/talam"
  gcs_engine_id = ""
  offlineSearch = true

  # talam is a backronym two ways: "Take A Look At Mesh" (what it does) and
  # "Tell Them" (what it's for) — the tool tells you what's wrong with your
  # mesh before your users have to.
  description = "talam — Take A Look At Mesh. Or just: tell 'em."

  [params.ui]
    sidebar_menu_compact = true
    breadcrumb_disable = false
    sidebar_search_disable = false
    navbar_logo = true
    navbar_translucent_over_cover_disable = false
    footer_about_disable = false
    [params.ui.feedback]
      enable = false
    [params.ui.readingtime]
      enable = false

  [params.links]
    [[params.links.user]]
      name = "GitHub Discussions"
      url = "https://github.com/nirvanagit/talam/discussions"
      icon = "fa-brands fa-github"
      desc = "Ask questions, propose ideas"
    [[params.links.developer]]
      name = "GitHub"
      url = "https://github.com/nirvanagit/talam"
      icon = "fa-brands fa-github"
      desc = "Source, issues, and pull requests"

[[menu.main]]
  name = "Docs"
  weight = 10
  url = "/docs/"

[[menu.main]]
  name = "GitHub"
  weight = 20
  url = "https://github.com/nirvanagit/talam"
  [menu.main.params]
    icon = "fa-brands fa-github"
