# talam-server only needs to read ModelBindings and the Secrets they
# reference, in its own namespace — it never touches mesh CRDs
# (docs/concepts/security-model.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: talam-server
  namespace: talam-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: talam-server
  namespace: talam-system
rules:
  - apiGroups: ["talam.dev"]
    resources: ["modelbindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: talam-server
  namespace: talam-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: talam-server
subjects:
  - kind: ServiceAccount
    name: talam-server
    namespace: talam-system
