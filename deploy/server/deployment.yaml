apiVersion: apps/v1
kind: Deployment
metadata:
  name: talam-server
  namespace: talam-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: talam-server }
  template:
    metadata:
      labels: { app: talam-server }
    spec:
      serviceAccountName: talam-server
      containers:
        - name: talam-server
          image: talam-server:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8443
          args:
            - "-addr=:8443"
            - "-store=/data/talam-server-store.json"
            - "-model-binding-namespace=talam-system"
            - "-model-binding-name=default"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /healthz, port: 8443 }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: talam-server
  namespace: talam-system
spec:
  selector: { app: talam-server }
  ports:
    - port: 8443
      targetPort: 8443
