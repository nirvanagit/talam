# See ADR-0005 (docs/decisions/0005-crd-native-incidents-and-resolutions.md)
# and ADR-0007 (docs/decisions/0007-agent-never-applies-remediation.md).
# talam-agent never applies spec.patch itself — this object is the artifact
# an external system (GitOps controller, existing config pipeline, human via
# kubectl) subscribes to and acts on. spec.approved is advisory only: a
# subscribing system may honor it as a gate on its own automation, or ignore
# it. status.outcome/appliedBy/appliedAt are written by whatever system
# applied the patch, not by talam.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: meshresolutions.talam.dev
spec:
  group: talam.dev
  scope: Namespaced
  names:
    kind: MeshResolution
    listKind: MeshResolutionList
    plural: meshresolutions
    singular: meshresolution
    shortNames: ["mres"]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Incident
          type: string
          jsonPath: .spec.incidentRef
        - name: Risk
          type: string
          jsonPath: .spec.riskTier
        - name: Approved
          type: boolean
          jsonPath: .spec.approved
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Outcome
          type: string
          jsonPath: .status.outcome
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["incidentRef", "serverProposalId", "target", "targetResourceVersion", "patch"]
              x-kubernetes-preserve-unknown-fields: true
              properties:
                incidentRef: { type: string }
                serverProposalId: { type: string }
                target:
                  type: object
                  properties:
                    kind: { type: string }
                    namespace: { type: string }
                    name: { type: string }
                targetResourceVersion: { type: string }
                summary: { type: string }
                explanation: { type: string }
                riskTier: { type: string, enum: ["Low", "Medium", "High"] }
                approved: { type: boolean, default: false }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase: { type: string, enum: ["Pending", "Approved", "Rejected", "Applied", "Failed"] }
                outcome: { type: string, enum: ["", "Applied", "Failed"] }
                appliedBy: { type: string }
                outcomeReported: { type: boolean }
                detail: { type: string }
                appliedAt: { type: string, format: date-time }
